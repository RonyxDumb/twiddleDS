name: Build NDS

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: TwiddlefingerDS
          path: TwiddlefingerDS.nds

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TwiddlefingerDS
      - uses: softprops/action-gh-release@v2
        with:
          name: Twiddlefinger DS ${{ github.ref_name }}
          files: TwiddlefingerDS.nds
          body: |
            Port per Nintendo DS della mod di Friday Night Funkin' **Twiddlefinger**.

            **Come giocare:** copia `TwiddlefingerDS.nds` sulla SD della flashcart (TWiLight Menu++ / nds-bootstrap) oppure aprilo con **melonDS**. DeSmuME non è supportato.

            **Controlli:** D-pad oppure Y/B/X/A per le frecce, START per la pausa, touch screen per il pulsante HELP (servono 75 tocchi per il finale buono).

            Tutti gli asset appartengono agli autori della mod Twiddlefinger e di Friday Night Funkin'. Progetto fan-made non ufficiale.
